name: fetch-uk-data
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_uk.py'
      - '.github/workflows/fetch-uk.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe DfT endpoints first
        continue-on-error: true
        run: |
          echo "== endpoint probe ==" > fetch-uk.log
          for u in \
            "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-collision-last-5-years.csv" \
            "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-collision-2023.csv" \
            "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-accident-last-5-years.csv" \
            "https://data.dft.gov.uk/road-accidents-safety-data/dft-road-safety-collision-last-5-years.csv" ; do
            code=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 60 "$u")
            size=$(curl -sIL --max-time 60 "$u" | grep -i '^content-length' | tail -1 | tr -d '\r')
            echo "$code  $size  $u" >> fetch-uk.log
          done
          echo "" >> fetch-uk.log
          echo "== data.gov.uk dataset listing ==" >> fetch-uk.log
          curl -s --max-time 60 "https://ckan.publishing.service.gov.uk/api/3/action/package_show?id=road-accidents-safety-data" \
            | head -c 4000 >> fetch-uk.log || echo "ckan failed" >> fetch-uk.log
      - name: Run fetcher
        continue-on-error: true
        run: |
          echo "" >> fetch-uk.log
          echo "== fetcher ==" >> fetch-uk.log
          python3 scripts/fetch_uk.py >> fetch-uk.log 2>&1 || echo "SCRIPT EXITED NONZERO" >> fetch-uk.log
      - name: Always commit log
        if: always()
        run: |
          git config user.name bot; git config user.email bot@kat
          git add -A
          git commit -m "UK fetch probe + log [skip ci]" || true
          git pull --rebase || true
          git push
